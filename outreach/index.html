<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>営業記録</title>
<style>
:root{--bg:#0b0b0d;--card:#16161b;--card2:#1f1f25;--line:#2d2d35;--text:#f3f0e8;--mute:#9b978d;--gold:#d6b25e;--gold2:#7d6932;--red:#e3665f;--green:#5cc08c;--blue:#72a9e6;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
main{max-width:560px;margin:0 auto;padding:10px 16px 24px}
h1{font-size:12px;letter-spacing:.18em;color:var(--gold);margin:10px 0 2px;font-weight:600}
a{color:var(--gold);text-decoration:none}
.mute{color:var(--mute)}.small{font-size:12px}.right{text-align:right}.grow{flex:1;min-width:0}.center{text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(14,14,17,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{flex:1;background:none;border:0;color:var(--mute);padding:8px 0 7px;font-size:11px;position:relative}
.tabs button b{display:block;font-size:19px;line-height:1.3;font-weight:400}
.tabs button.on{color:var(--gold)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-style:normal}
.counter{display:block;margin:18px auto 12px;width:min(70vw,260px);aspect-ratio:1;border-radius:50%;border:0;padding:9px;background:conic-gradient(var(--gold) var(--p),var(--line) 0);color:var(--text);font:inherit}
.counter span{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#24242b,#101013);transition:transform .1s}
.counter:active span{transform:scale(.96)}
.counter .n{font-size:88px;font-weight:200;line-height:1}
.counter .g{color:var(--mute);font-size:14px;font-style:normal}
.counter .plus{margin-top:10px;color:var(--gold);font-size:14px;letter-spacing:.08em;font-style:normal}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--gold);color:#17130a;font:inherit;font-weight:700;font-size:16px;padding:14px;margin-top:12px;text-align:center}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.5}
.btn2{display:inline-block;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
textarea{resize:vertical}
.row input{flex:1;min-width:0;width:auto}
.lb{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px}
.card{display:block;width:100%;text-align:left;color:var(--text);font:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.warn{background:rgba(227,102,95,.12);border:1px solid rgba(227,102,95,.5);color:#ffbab5;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.ok{background:rgba(92,192,140,.12);border:1px solid rgba(92,192,140,.45);color:#aee6c7;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.hint{color:var(--mute);font-size:13px;margin-top:8px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;-webkit-overflow-scrolling:touch}
.sheetHead{position:sticky;top:0;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(11,11,13,.97);border-bottom:1px solid var(--line);z-index:2}
.sheetHead button{background:none;border:0;color:var(--gold);font:inherit;font-size:16px;padding:6px 8px 6px 0}
.sheetHead b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetBody{max-width:560px;margin:0 auto;padding:6px 16px calc(40px + env(safe-area-inset-bottom))}
.pick{display:flex;align-items:center;justify-content:center;flex-direction:column;border:1px dashed var(--gold2);border-radius:12px;min-height:84px;color:var(--gold);padding:10px;text-align:center}
.pick img{max-width:100%;max-height:260px;border-radius:8px;margin-top:8px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.av{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--card2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--card2);color:var(--mute);border:1px solid var(--line);margin:2px 4px 0 0}
.s-reply_comment,.s-reply_dm{color:var(--blue);border-color:rgba(114,169,230,.5)}
.s-considering,.s-rough{color:var(--gold);border-color:var(--gold2)}
.s-purchased{color:var(--green);border-color:rgba(92,192,140,.5)}
.s-lost{color:#8a6763}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:99px;padding:7px 12px;font:inherit;font-size:13px}
.chip.on{background:var(--gold);color:#17130a;border-color:var(--gold);font-weight:700}
.msg{white-space:pre-wrap;word-break:break-word}
.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.tl{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:10px 0 10px 2px}
.tl.them{border-color:var(--gold)}
.shot{display:block;max-width:140px;border-radius:8px;margin-top:6px;border:1px solid var(--line);min-height:40px;background:var(--card2)}
.bars{display:flex;gap:6px;align-items:flex-end;height:80px;margin-top:22px}
.bars div{flex:1;background:var(--gold2);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bars div.today{background:var(--gold)}
.bars s{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;text-decoration:none;color:var(--text)}
.barl{display:flex;gap:6px;margin-top:4px}.barl span{flex:1;text-align:center;font-size:10px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--mute);font-weight:500;font-size:11px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}.kpi b{display:block;font-size:21px;font-weight:500}.kpi span{font-size:11px;color:var(--mute)}
.sec{font-size:12px;color:var(--mute);letter-spacing:.1em;margin:22px 0 4px}
.ja{font-size:12px;color:var(--mute);margin-top:6px;white-space:pre-wrap}
.ja summary{cursor:pointer}
.due{color:var(--red)}.soon{color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.danger{background:none;border:1px solid rgba(227,102,95,.5);color:var(--red);border-radius:10px;padding:11px;width:100%;margin-top:28px;font:inherit}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f3f0e8;color:#111;padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.sig{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px;margin-top:10px;border:1px solid currentColor}
.sig i{width:26px;height:26px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 14px currentColor;margin-top:2px}
.sig .grow{color:var(--text)}
.sig.g{color:var(--green);background:rgba(92,192,140,.1)}.sig.y{color:#e8c14a;background:rgba(232,193,74,.1)}.sig.r{color:var(--red);background:rgba(227,102,95,.12)}
.tpl{display:flex;align-items:center;gap:12px;width:100%;min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px;margin-top:8px;color:var(--text);font:inherit}
.tpl .ck{width:34px;height:34px;border-radius:9px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#17130a}
.qs{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--card)}.qs.done{opacity:.75}.qs.cur{border-color:var(--gold);background:rgba(214,178,94,.1)}.qh{display:flex;align-items:center;gap:10px}.qk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#17130a}.qk.on{background:var(--gold);border-color:var(--gold)}.btn2.qon{background:var(--gold);color:#17130a;border-color:var(--gold)}
.tpl.on{border-color:var(--gold);background:rgba(214,178,94,.12)}.tpl.on .ck{background:var(--gold);border-color:var(--gold)}.tpl.on .ck::after{content:'✓'}
.tpl b{display:block;font-size:14px;font-weight:600}.tpl small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{margin-top:18px;color:var(--mute);font-size:13px}.more summary{cursor:pointer;padding:6px 0}
.s-ng{color:var(--red);border-color:rgba(227,102,95,.6)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:50;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.viewer img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<main id="main"></main>
<nav class="tabs">
  <button data-tab="today"><b>●</b>今日</button>
  <button data-tab="list"><b>☰</b>顧客</button>
  <button data-tab="remind"><b>◷</b>リマインド<i class="badge" id="dueBadge" hidden></i></button>
  <button data-tab="data"><b>▤</b>データ</button>
</nav>
<div id="sheet" class="sheet" hidden><div class="sheetHead"><button id="back">‹ 戻る</button><b id="sheetTitle"></b></div></div>
<div id="viewer" class="viewer" hidden><img alt=""></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
const VER='20261007-5';
const MODEL='claude-haiku-4-5-20251001';
const ST={waiting:['未返信',0],reply_comment:['コメント返信あり',1],reply_dm:['DM返信あり',2],considering:['検討中',3],rough:['ラフ依頼',4],purchased:['購入済み',5],lost:['見送り',-1]};
const GENRE={owner:'オーナー',photographer:'フォトグラファー',influencer:'インフルエンサー',shop:'ショップ',media:'メディア',other:'その他'};
const SYS="You help Takuya Tagishi, a Japanese craftsman who runs Driver's Collection (Instagram @drivers_collection_): handmade one-of-one art trading cards made from a customer's car photo (the owner can be in it too). Semi-order ¥30,000 (pick a gallery design, quick), full order ¥50,000 (one-of-a-kind design from scratch, gold authentication tag), optional light-up wall display +¥10,000. Free rough mock before purchase. Ships worldwide by EMS. He reaches out to car owners, car photographers and influencers on Instagram with comments and DMs. Always answer with one JSON object only, no other text.";
const TPL=[
 {id:'1-1',g:'c1',ch:'comment',label:'①-1 機材編',text:'めちゃくちゃカッコよく撮れてますね！！\n何か機材を使って撮ってるんですか？'},
 {id:'1-2',g:'c1',ch:'comment',label:'①-2 アプリ編',text:'この色味、すごく好きです！\n編集はどんなアプリでやってるんですか？'},
 {id:'1-3',g:'c1',ch:'comment',label:'①-3 場所編',text:'撮影場所の雰囲気が最高ですね✨\nもし聞いて大丈夫でしたら、どちらで撮影されたんですか？'},
 {id:'1-4',g:'c1',ch:'comment',label:'①-4 カスタム編',text:'めちゃめちゃかっこいいですね！！\nこれはなにかカスタムされてるんですか？'},
 {id:'1-5',g:'c1',ch:'comment',label:'①-5 カラー編',text:'めっちゃいい色ですね！\nなんてカラーなんですか？'},
 {id:'2-1',g:'c2',ch:'comment',label:'②-1 そうだったんですね(機材の返事)',text:'そうだったんですね！\nいやぁほんとカッコよくて、何度も保存したの見返してます笑\n実はご相談があって、お手すきのタイミングでDMを見てもらえると嬉しいです!'},
 {id:'2-2',g:'c2',ch:'comment',label:'②-2 なるほど(アプリの返事)',text:'なるほど、だからこんなにかっこいいんですね！\n保存して何回も見返してます笑\n実はひとつご相談があって、お時間あるときにDMを見ていただけたら嬉しいです！'},
 {id:'2-3',g:'c2',ch:'comment',label:'②-3 教えてくれた(場所の返事)',text:'教えて下さってありがとうございます！\n本当にカッコよくてスクショしちゃいました笑\n実はご相談があって、DMを送ったのでお手すきのときに見てもらえると嬉しいです🙏'},
 {id:'2-4',g:'c2',ch:'comment',label:'②-4 そうだったんですね(カスタムの返事)',text:'教えてくださってありがとうございます！\nカッコ良すぎて、何度も見返してます笑\n実はご相談があって、お手すきのタイミングでDMを見てもらえると嬉しいです！'},
 {id:'2-5',g:'c2',ch:'comment',label:'②-5 なるほど(カラーの返事)',text:'なるほど、そのカラーなんですね！\nカッコ良すぎて何回も見返してます笑\n実はひとつご相談があって、お時間あるときにDMを見ていただけたら嬉しいです！'},
 {id:'3',g:'dm',ch:'dm',label:'③ DM(無料デザインのご提案)',text:'突然のDM失礼します、Driver\'s Collectionと申します。\n先ほどはコメントへのご返信ありがとうございました！\n\n実は、オーナーさんの愛車を世界に一枚のトレカアートに仕上げる活動をしています！\n\nもしご興味があれば、愛車でカードデザインを無料で作らせていただけませんか？\n\nこれまでの作品はこのアカウントの投稿で見られますので、気軽にお返事いただけたら嬉しいです！'}];
function tplCustom(){try{return JSON.parse(ls('dc_out_tpl')||'{}')}catch(e){return {}}}
const tplText=id=>{const c=tplCustom();if(c[id])return c[id];const t=TPL.find(x=>x.id===id);return t?t.text:''};
const tplLabel=id=>{const t=TPL.find(x=>x.id===id);return t?t.label.split(' ')[0]:id};
const OWN='drivers_collection_';
const P_REPLY='Screenshot from Instagram: either a comment thread or a DM thread. The sender of the screenshot is the account "drivers_collection_" (his messages are "me"; ignore this account, never return it as the other person).\nReturn JSON: {"username":"the OTHER person\'s Instagram handle, exactly as shown, without @ (the author of the reply or the person on the other side of the DM; never drivers_collection_)","others":["every other handle visible besides drivers_collection_, without @"],"name":"their display name if shown, else empty","channel":"dm|comment","messages":[{"from":"them|me","text":"..."}]}\nOnly readable messages, oldest first, at most 12, original language.';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const localDT=d=>ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
const md=s=>{const d=new Date(s);return (d.getMonth()+1)+'/'+d.getDate()};
const mdhm=s=>{const d=new Date(s);return md(s)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const eod=()=>{const d=new Date();d.setHours(23,59,59,999);return d};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const S={get key(){return ls('dc_out_key')||''},set key(v){ls('dc_out_key',v)},get goal(){return Math.max(1,+ls('dc_out_goal')||10)},set goal(v){ls('dc_out_goal',v)}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
function copy(t){if(!t)return;const ok=()=>toast('コピーしました');if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>fallback());else fallback();function fallback(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('コピーできませんでした')}a.remove()}}
function parseUser(s){s=(s||'').trim();let m=s.match(/instagram\.com\/([A-Za-z0-9._]+)/i);if(m&&!/^(p|reel|reels|stories|explore|accounts|tv)$/i.test(m[1]))return m[1].toLowerCase();m=s.match(/^@?([A-Za-z0-9._]{1,30})$/);return m?m[1].toLowerCase():''}
const clean=u=>String(u||'').replace(/^@/,'').replace(/…|\.\.\.$|\s/g,'').toLowerCase();
/* look-alike IDs (l/I/1, 0/o, . and _) so a misread ID still finds the earlier record */
const norm=s=>String(s||'').toLowerCase().replace(/[1i|]/g,'l').replace(/0/g,'o').replace(/[._]/g,'');
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;let prev=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[b.length]}
const similar=u=>{const nu=norm(u);return P.filter(x=>x.username!==u&&(norm(x.username)===nu||(nu.length>=6&&lev(norm(x.username),nu)<=1)))};
const sameName=n=>{n=String(n||'').trim().toLowerCase();return n?P.filter(x=>x.name&&x.name.trim().toLowerCase()===n):[]};
function nextAt(days,time){days=Math.max(0,parseInt(days)||0);const d=new Date();d.setDate(d.getDate()+days);const m=/^(\d{1,2}):(\d{2})$/.exec(time||'');d.setHours(m?+m[1]:20,m?+m[2]:0,0,0);if(d<new Date()){const n=new Date();n.setMinutes(n.getMinutes()+5);return localDT(n)}return localDT(d)}

/* ---------- storage ---------- */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('dc-outreach',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('people',{keyPath:'id'});d.createObjectStore('images',{keyPath:'id'})};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 tx(st,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(st,mode),s=t.objectStore(st);let out;const q=fn(s);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})},
 all(st){return this.tx(st,'readonly',s=>s.getAll())},get(st,id){return this.tx(st,'readonly',s=>s.get(id))},
 put(st,v){return this.tx(st,'readwrite',s=>s.put(v))},del(st,id){return this.tx(st,'readwrite',s=>s.delete(id))},clear(st){return this.tx(st,'readwrite',s=>s.clear())}};
let P=[],view='today',filter='all',q='';
const byId=id=>P.find(p=>p.id===id);
async function save(p){if(!P.includes(p))P.push(p);await DB.put('people',JSON.parse(JSON.stringify(p)))}
async function putImg(d){const id=uid();await DB.put('images',{id,d});return id}
async function getImg(id){const r=await DB.get('images',id);return r&&r.d}
function newPerson(n){return{id:uid(),username:n,url:'https://www.instagram.com/'+n+'/',created:new Date().toISOString(),firstDate:today(),inbound:false,genre:'',country:'',followers:'',car:'',name:'',who:'',summary:'',memo:'',lang:'',status:'waiting',profileImg:null,thumb:'',events:[],next:null,ai:''}}
function upStatus(p,s){if(!ST[s]||p.status===s)return;if(p.status==='purchased')return;if(s==='lost'){p.status='lost';return}if(p.status==='lost'||ST[s][1]>ST[p.status][1])p.status=s}

/* ---------- images ---------- */
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const full=c.toDataURL('image/jpeg',.72);const th=Math.round(h*.22),tw=Math.min(w,900),tc=document.createElement('canvas');tc.width=tw;tc.height=Math.round(th*tw/w);tc.getContext('2d').drawImage(im,0,0,w,th,0,0,tc.width,tc.height);const top=tc.toDataURL('image/jpeg',.8);const t=document.createElement('canvas');t.width=t.height=96;const side=Math.min(w,h),sy=Math.min(h-side,Math.round(h*.06));t.getContext('2d').drawImage(im,0,sy,side,side,0,0,96,96);URL.revokeObjectURL(url);res({full,top,thumb:t.toDataURL('image/jpeg',.6)})};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('画像を読めません'))};im.src=url})}
function pick(input,cb){input.onchange=async()=>{const f=input.files&&input.files[0];if(!f)return;try{const r=await compress(f);const box=input.parentElement,im=box.querySelector('img');if(im){im.src=r.full;im.hidden=false}const sp=box.querySelector('span');if(sp)sp.textContent='画像を変更';cb(r)}catch(e){toast(e.message)}input.value=''}}
const imgPart=d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d.split(',')[1]}});
function loadImgs(el){el.querySelectorAll('img[data-imgid]').forEach(async im=>{const d=await getImg(im.dataset.imgid);if(d)im.src=d;im.onclick=()=>viewer(im.src)})}
function viewer(src){const v=$('#viewer');v.querySelector('img').src=src;v.hidden=false;v.onclick=()=>{v.hidden=true}}

/* ---------- AI (Anthropic API, called straight from this page) ---------- */
function cost(){let c={};try{c=JSON.parse(ls('dc_out_cost')||'{}')}catch(e){}const m=today().slice(0,7);if(c.m!==m)c={m,usd:0,calls:0};return c}
function addCost(u){if(!u)return;const c=cost();c.usd+=((u.input_tokens||0)*1+(u.output_tokens||0)*5)/1e6;c.calls++;ls('dc_out_cost',JSON.stringify(c))}
async function claude(content,max){
 if(!S.key)throw new Error('APIキーが未設定です');
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL,max_tokens:max,system:SYS,messages:[{role:'user',content}]})});
 let d={};try{d=await r.json()}catch(e){}
 if(!r.ok)throw new Error((d.error&&d.error.message)||('HTTP '+r.status));
 addCost(d.usage);
 const t=(d.content||[]).map(c=>c.text||'').join(''),m=t.match(/\{[\s\S]*\}/);
 if(!m)throw new Error('AIの返答を読めませんでした');return JSON.parse(m[0])}
function streak(p){const days=new Set();for(let i=p.events.length-1;i>=0;i--){const e=p.events[i];if(e.kind==='reply')break;days.add(ymd(new Date(e.at)))}return days.size}
function history(p){return p.events.slice(-20).map(e=>{const d=md(e.at),cut=t=>String(t||'').slice(0,400);if(e.kind==='reply'&&e.msgs&&e.msgs.length)return e.msgs.map(m=>`${d} ${m.from==='me'?'me':'them'} (${e.ch}): ${cut(m.text)}`).join('\n');return `${d} ${e.kind==='reply'?'them':'me'} (${e.ch}): ${cut(e.text)||'(screenshot)'}`}).join('\n')}
async function aiProfile(p,force){
 if(!S.key){toast('APIキーが未設定です');return}
 p.ai='プロフィールを読み取り中…';await save(p);render();refresh(p);
 try{const c=[];if(p.profileImg){const d=await getImg(p.profileImg);if(d)c.push(imgPart(d))}
  const sent=p.events.filter(e=>e.kind==='sent').map(e=>(e.ch==='dm'?'DM: ':'Comment: ')+e.text).join('\n');
  c.push({type:'text',text:`${c.length?'Screenshot: Instagram profile of':'No screenshot. Instagram account'} @${p.username}, whom he just contacted.\nWhat he sent:\n${sent||'(nothing recorded)'}\nReturn JSON:\n{"username":"handle shown in the screenshot, no @","name":"display name","genre":"owner|photographer|influencer|shop|media|other (owner = car owner)","country":"country in Japanese like アメリカ, or empty","followers":number or null,"car":"their car model(s) or empty","summary_ja":"who they are in Japanese, max 40 chars","lang":"language to use with them (ja/en/ko/zh/...)","next_in_days":3 to 7,"next_time":"HH:MM Japan time that is early evening in their time zone","next_text":"short friendly follow-up in their language, to send if they do not reply","next_text_ja":"Japanese translation of next_text, empty if lang is ja"}`});
  const j=await claude(c,800);
  const set=(k,v)=>{if(v!==undefined&&v!==null&&v!==''&&(force||!p[k]))p[k]=v};
  set('name',j.name);set('genre',GENRE[j.genre]?j.genre:(j.genre?'other':''));set('country',j.country);set('followers',j.followers);set('car',j.car);set('who',j.summary_ja);set('lang',j.lang);
  const u=clean(j.username);if(u&&u!==p.username&&!(p.memo||'').includes(u))p.memo=(p.memo?p.memo+'\n':'')+'※スクショのID: @'+u;
  
  p.ai=''}catch(e){p.ai='読み取り失敗: '+e.message}
 await save(p);render();refresh(p)}
async function aiPlan(p){
 if(!S.key){toast('APIキーが未設定です');return}
 p.ai='AIが次の一手を考え中…';await save(p);render();refresh(p);
 try{const j=await claude([{type:'text',text:`Customer: @${p.username}${p.name?' / '+p.name:''} / ${GENRE[p.genre]||'?'} / ${p.country||'?'} / car: ${p.car||'?'} / ${p.who||''}\nCurrent status: ${p.status}\nConversation (oldest first):\n${history(p)||'(none)'}\nDays in a row he messaged without any reply from them (first contact counts): ${streak(p)}\nToday: ${today()} (Japan)\nDecide his next action. Return JSON:\n{"status":"waiting|reply_comment|reply_dm|considering|rough|purchased|lost","summary_ja":"current situation in Japanese, max 60 chars","next_in_days":integer or null,"next_time":"HH:MM Japan time, early evening in their time zone","next_text":"message he should send next, in their language","next_text_ja":"Japanese translation, empty if Japanese"}\nRules: waiting = no reply yet; reply_comment / reply_dm = they replied; considering = interested or asked price/details; rough = asked for the free rough mock; purchased = paid; lost = clearly declined. If their last message needs an answer, next_in_days = 0 and next_text answers it. If he spoke last, follow up in 3-7 days only if it adds value. If the streak is 3 or more, or they declined, next_in_days = null. Messages: warm and human, 2-4 sentences, specific to their car or photo, no links, no pressure, price only if they asked; offering the free rough mock is a good natural step.`}],900);
  upStatus(p,j.status);if(j.summary_ja)p.summary=j.summary_ja;

const OPT={semi:'セミ',full:'フル'};
const QS=[
 {k:'c1',t:'コメント①を送る',auto:p=>p.events.some(e=>e.kind==='sent'&&/^1-/.test(e.tpl||'')||e.kind==='sent'&&e.ch==='comment'&&!e.tpl),hint:'下の「次に送る」から送るとチェックされます'},

 {k:'dm',t:'③DMを送る',auto:p=>p.events.some(e=>e.kind==='sent'&&(e.tpl==='3'||e.ch==='dm')),hint:'「次に送る」から③を送る'},
 {k:'dr',t:'DMの返信が来た',auto:p=>['reply_dm','considering','rough','purchased'].includes(p.status)||p.events.some(e=>e.kind==='reply'&&e.ch==='dm'),hint:'返信のスクショを追加すると自動でチェックされます'},
 {k:'mat',t:'画像・記載内容をもらった'},
 {k:'req',t:'ラフ依頼をもらった',o:1},
 {k:'rough',t:'ラフを送った',o:1,note:'作成は3分でも1日あけてから送る'},
 {k:'buy',t:'購入',o:1}];
const qv=(p,k)=>(p.q&&p.q[k])||null;
function qDone(p,k){const s=QS.find(x=>x.k===k);if(qv(p,k))return qv(p,k);if(s.auto&&s.auto(p))return {v:true,at:null};return null}
const qCur=p=>{let hi=-1;QS.forEach((s,i)=>{if(qDone(p,s.k))hi=i});return (QS.slice(hi+1)[0]||{}).k};
function remind(p){if(p.ng||p.status==='lost'||qDone(p,'buy')||!qDone(p,'dr'))return null;
 const add=(iso,d)=>{const x=new Date(iso||Date.now());x.setDate(x.getDate()+d);x.setHours(20,0,0,0);return localDT(x)};
 const lastRep=(p.events.filter(e=>e.kind==='reply'&&e.ch==='dm').pop()||{}).at;
 let r;const m=qDone(p,'mat'),q=qDone(p,'req'),h=qDone(p,'rough');
 if(h)r={at:add(h.at,3),label:'ラフを送って数日 → 購入の確認'};
 else if(q)r={at:add(q.at,1),label:'ラフ依頼あり → ラフを作って送る(1日あけて)'};
 else if(m)r={at:add(m.at,2),label:'材料はもらった → ラフ依頼の意思を確認'};
 else r={at:add(lastRep,1),label:'画像・記載内容がまだ → 確認する'};
 if(p.next&&p.next.at)r.at=p.next.at;return r}
async function qSet(p,k,v){const cur=qv(p,k);p.q=p.q||{};if(cur&&(v===true||cur.v===v)){delete p.q[k]}else{p.q[k]={v,at:new Date().toISOString()};if(k==='req')upStatus(p,'rough');if(k==='buy')upStatus(p,'purchased')}p.next=null;await save(p);render();refresh(p)}
function questHtml(p){const cur=qCur(p);return QS.map(s=>{const d=qDone(p,s.k),isCur=s.k===cur;
 const mark=`<span class="qk ${d?'on':''}">${d?'✓':''}</span>`;
 const when=d&&d.at?` · ${md(d.at)}`:'';
 let ctl='';
 if(s.o)ctl=`<div class=row style="margin-top:8px"><button class="btn2 ${d&&d.v==='semi'?'qon':''}" data-q="${p.id}|${s.k}|semi">${OPT.semi}</button><button class="btn2 ${d&&d.v==='full'?'qon':''}" data-q="${p.id}|${s.k}|full">${OPT.full}${s.k==='rough'?'(温度感高い時)':''}</button></div>`;
 else if(!s.auto)ctl=`<div class=row style="margin-top:8px"><button class="btn2 ${d?'qon':''}" data-q="${p.id}|${s.k}|1">${d?'済み(タップで戻す)':'もらった ✓'}</button></div>`;
 else if(isCur&&s.hint)ctl=`<div class=hint style="margin-top:6px">${s.hint}</div>`;
 return `<div class="qs ${d?'done':''} ${isCur?'cur':''}"><div class=qh>${mark}<div class=grow><b>${s.t}</b>${d&&typeof d.v==='string'?` <span class=pill>${OPT[d.v]}</span>`:''}<span class="mute small">${when}</span></div></div>${s.note&&isCur?`<div class="mute small">${s.note}</div>`:''}${ctl}</div>`}).join('')}
const sentSet=p=>new Set(p.events.filter(e=>e.kind==='sent'&&e.tpl).map(e=>e.tpl));
const hasReply=p=>p.status!=='waiting'&&p.status!=='lost'||p.events.some(e=>e.kind==='reply');
function nextTpls(p){const sent=sentSet(p),out=[];if(!hasReply(p))return out;const c1=p.events.filter(e=>e.kind==='sent'&&/^1-/.test(e.tpl||'')).pop();if(c1){const id='2-'+c1.tpl.slice(2);if(TPL.some(t=>t.id===id)&&!sent.has(id))out.push(id)}if(!sent.has('3'))out.push('3');return out}
const tplRow=(id,p)=>{const t=TPL.find(x=>x.id===id),on=sentSet(p).has(id);return `<button class="tpl ${on?'on':''}" data-dt="${id}" data-pid="${p.id}"><span class=grow><b>${esc(t.label)}</b><small>${esc(tplText(id).replace(/\n/g,' '))}</small></span><span class=ck></span></button>`};
function nextBox(p){const L=nextTpls(p);return L.length?L.map(id=>tplRow(id,p)).join('')+'<div class=hint style="margin-top:6px">タップ=コピー+送信済みに記録</div>':`<div class=hint>${hasReply(p)?'用意した返信はすべて送信済みです':'返信待ちです(コメントに返信が来たら ②・③ が出ます)'}</div>`}
async function sendTpl(p,id){const t=TPL.find(x=>x.id===id);if(!t)return;const tx=tplText(id);copy(tx);if(sentSet(p).has(id))return;p.events.push({id:uid(),at:new Date().toISOString(),kind:'sent',ch:t.ch,tpl:id,text:tx});if(t.g==='c2')upStatus(p,'reply_comment');await save(p);render();refresh(p)}
function detailFn(p){return b=>{const n=p.next||{};
 b.innerHTML=`<div class=item style="border:0">${av(p)}<div class=grow><a href="${esc(p.url)}" target=_blank rel=noopener><b>@${esc(p.username)}</b> ↗</a><div class="mute small">${esc(p.name||'')} ${p.inbound?'· 相手から連絡':'· 初回 '+md(p.created)}${p.who?'<br>'+esc(p.who):''}</div></div></div>
 ${p.ai?`<div class=hint>${esc(p.ai)}</div>`:''}${p.summary?`<div class=card style="margin-top:2px">${esc(p.summary)}</div>`:''}
 <div class=sec>状態</div><div class="chips wrap">${Object.keys(ST).map(s=>`<button class="chip ${p.status===s?'on':''}" data-st="${s}">${ST[s][0]}</button>`).join('')}</div>
 <div class=sec>進行クエスト</div>${questHtml(p)}
 <div class=sec>次に送る</div>
 ${nextBox(p)}
 <details class=more><summary>ほかのテンプレを送る</summary>${TPL.map(t=>tplRow(t.id,p)).join('')}</details>

 <div class=row><input type=datetime-local id=dAt value="${esc((remind(p)||n).at||'')}" style="flex:1"><button class=btn2 id=dClr>自動に戻す</button></div>
 <details class=more><summary>自由な文面を送る</summary><textarea id=dTx rows=4 style="margin-top:8px" placeholder="自由な文面">${esc(n.text||'')}</textarea><div class=row style="margin-top:8px"><button class=btn2 id=dCopy>コピー</button><button class=btn2 id=dSent>送った ✓</button></div></details>
 <button class=btn id=dReply>返信のスクショを追加</button>
 <button class="btn ghost" id=dLogT>送った文章を記録</button>
 <div id=dLog class=card hidden><div class=chips><button class="chip on" data-lch=dm>DM</button><button class=chip data-lch=comment>コメント</button></div><textarea id=dLogTx rows=3 placeholder="送った文章"></textarea><button class=btn id=dLogSave>記録する</button></div>

 <div class=grid><div><label class=lb>ジャンル</label><select id=fG><option value="">-</option>${Object.keys(GENRE).map(g=>`<option value="${g}" ${p.genre===g?'selected':''}>${GENRE[g]}</option>`).join('')}</select></div><div><label class=lb>国</label><input id=fC value="${esc(p.country)}"></div><div><label class=lb>フォロワー</label><input id=fF inputmode=numeric value="${esc(p.followers)}"></div><div><label class=lb>車</label><input id=fCar value="${esc(p.car)}"></div></div>
 <label class=lb>メモ</label><textarea id=fM rows=2>${esc(p.memo)}</textarea>
 ${p.profileImg?`<img class=shot data-imgid="${p.profileImg}" alt="">`:''}
 <div class=row style="margin-top:10px"><label class=btn2>${p.profileImg?'スクショを差し替え':'スクショを追加'}<input type=file accept="image/*" id=fImg hidden></label><button class=btn2 id=dProf>AIで読み取り直す</button></div>
 <button class="btn ghost" id=dNg style="margin-top:20px;${p.ng?'color:var(--red);border-color:var(--red)':''}">${p.ng?'🔴 連絡NG(要注意)を解除':'連絡NG(要注意)にする'}</button>
 <button class=danger id=dDel>この記録を削除</button>`;
 const g=s=>b.querySelector(s),upd=async()=>{await save(p);render()};
 b.querySelectorAll('[data-st]').forEach(x=>x.onclick=async()=>{p.status=x.dataset.st;await upd();refresh(p)});
 const setNext=async()=>{const at=g('#dAt').value,tx=g('#dTx').value;p.next=(at||tx.trim())?{at:at||nextAt(0),text:tx,ja:(tx===(n.text||''))?(n.ja||''):''}:null;await upd()};
 b.querySelectorAll('[data-undo]').forEach(x=>x.onclick=async()=>{p.events=p.events.filter(e=>e.id!==x.dataset.undo);await upd();refresh(p);toast('取り消しました')});
 g('#dAt').onchange=setNext;g('#dTx').onchange=setNext;
 g('#dCopy').onclick=()=>copy(g('#dTx').value);
 g('#dSent').onclick=async()=>{await setNext();if(!p.next||!p.next.text.trim()){toast('送る文章がありません');return}markSent(p)};
 g('#dClr').onclick=async()=>{p.next=null;await upd();refresh(p)};
 g('#dReply').onclick=()=>openSheet('返信を追加',replyFn(p));
 let lch='dm';g('#dLogT').onclick=()=>{g('#dLog').hidden=!g('#dLog').hidden};
 b.querySelectorAll('[data-lch]').forEach(x=>x.onclick=()=>{lch=x.dataset.lch;b.querySelectorAll('[data-lch]').forEach(y=>y.classList.toggle('on',y===x))});
 g('#dLogSave').onclick=async()=>{const t=g('#dLogTx').value.trim();if(!t)return;p.events.push({id:uid(),at:new Date().toISOString(),kind:'sent',ch:lch,text:t});await upd();refresh(p);toast('記録しました');if(S.key)aiPlan(p)};
 g('#fG').onchange=e=>{p.genre=e.target.value;upd()};g('#fC').onchange=e=>{p.country=e.target.value.trim();upd()};g('#fF').onchange=e=>{p.followers=e.target.value.trim();upd()};g('#fCar').onchange=e=>{p.car=e.target.value.trim();upd()};g('#fM').onchange=e=>{p.memo=e.target.value;upd()};
 pick(g('#fImg'),async r=>{p.profileImg=await putImg(r.full);p.thumb=r.thumb;await upd();refresh(p);if(S.key)aiProfile(p,true)});
 g('#dProf').onclick=()=>aiProfile(p,true);
 g('#dNg').onclick=async()=>{p.ng=!p.ng;if(p.ng)p.next=null;await upd();refresh(p);toast(p.ng?'連絡NGにしました':'解除しました')};
 g('#dDel').onclick=async()=>{if(!confirm('@'+p.username+' の記録を削除します。よろしいですか?'))return;for(const id of [p.profileImg,...p.events.map(e=>e.img)])if(id)await DB.del('images',id);await DB.del('people',p.id);P=P.filter(x=>x!==p);closeSheet();render();toast('削除しました')};
}}

function vToday(){const t=today(),n=P.filter(p=>!p.inbound&&p.firstDate===t).length,g=S.goal,pc=Math.min(100,n/g*100);
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=ymd(d);return{l:i===6?'今日':(d.getMonth()+1)+'/'+d.getDate(),n:P.filter(p=>!p.inbound&&p.firstDate===k).length,t:i===6}});
 const mx=Math.max(g,...days.map(d=>d.n)),wk=days.reduce((a,d)=>a+d.n,0),due=P.filter(isDue).length;
 return `<h1>DRIVER'S COLLECTION ─ 営業記録</h1><div class="mute small">${t.replace(/-/g,'/')}</div>
 <button class=counter id=bigBtn style="--p:${pc}%"><span><b class=n>${n}</b><i class=g>/ ${g} 人</i><i class=plus>＋ 新規アプローチ</i></span></button>
 ${n>=g?'<div class="ok center">今日の目標達成 🎉</div>':''}
 <button class="btn ghost" id=replyBtn>返信のスクショを貼る</button>
 ${due?`<button class=card data-tab=remind>⏰ 今日までのリマインド <b>${due}件</b> →</button>`:''}
 ${S.key?'':'<div class=hint>「データ」タブでAPIキーを入れると、スクショの自動読み取りと文面の提案が使えます。</div>'}
 <div class=sec>直近7日(計${wk}人)</div><div class=bars>${days.map(d=>`<div class="${d.t?'today':''}" style="height:${d.n/mx*100}%"><s>${d.n||''}</s></div>`).join('')}</div><div class=barl>${days.map(d=>`<span>${d.l}</span>`).join('')}</div>`}
function rows(){const k=q.trim().toLowerCase().replace(/^@/,'');const L=P.filter(p=>(filter==='all'||p.status===filter)&&(!k||[p.username,p.name,p.country,p.car,p.who,p.summary,p.memo].join(' ').toLowerCase().includes(k))).sort((a,b)=>last(b).localeCompare(last(a)));
 if(!L.length)return '<div class=hint>該当する記録はありません</div>';
 return L.map(p=>`<div class=item data-open="${p.id}">${av(p)}<div class=grow><b>@${esc(p.username)}</b><div>${p.ng?'<span class="pill s-ng">連絡NG</span>':''}${stPill(p.status)}${p.genre?`<span class=pill>${GENRE[p.genre]||esc(p.genre)}</span>`:''}${p.country?`<span class=pill>${esc(p.country)}</span>`:''}</div>${p.summary||p.who?`<div class="mute small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.summary||p.who)}</div>`:''}</div><div class="mute small right">${md(last(p))}${p.next&&p.next.at?`<br><span class="${isDue(p)?'due':''}">⏰${md(p.next.at)}</span>`:''}</div></div>`).join('')}
function vList(){const cnt=s=>P.filter(p=>s==='all'||p.status===s).length;
 return `<h1>顧客リスト</h1><input id=q type=search autocapitalize=off placeholder="@ユーザー名・国・車で検索" value="${esc(q)}" style="margin-top:8px">
 <div class=chips>${['all',...Object.keys(ST)].map(s=>`<button class="chip ${filter===s?'on':''}" data-f="${s}">${s==='all'?'すべて':ST[s][0]} ${cnt(s)}</button>`).join('')}</div><div id=rows>${rows()}</div>`}
function rcard(p){const r=remind(p),late=new Date(r.at)<new Date(),c=qCur(p);
 const qb=c==='mat'?`<button class=btn2 data-q="${p.id}|mat|1">もらった ✓</button>`:c==='req'?`<button class=btn2 data-q="${p.id}|req|semi">ラフ依頼 セミ</button><button class=btn2 data-q="${p.id}|req|full">フル</button>`:c==='rough'?`<button class=btn2 data-q="${p.id}|rough|semi">ラフ送った(セミ)</button><button class=btn2 data-q="${p.id}|rough|full">フル</button>`:c==='buy'?`<button class=btn2 data-q="${p.id}|buy|semi">購入 セミ</button><button class=btn2 data-q="${p.id}|buy|full">フル</button>`:'';
 return `<div class=card><div class=item style="border:0;padding:0">${av(p)}<div class=grow><a href="${esc(p.url)}" target=_blank rel=noopener><b>@${esc(p.username)}</b> ↗</a><div class="small ${late?'due':'soon'}">${mdhm(r.at)}${late?'(期限)':''} ${stPill(p.status)}</div></div><button class=btn2 data-open="${p.id}">開く</button></div>
 <div class=msg style="margin-top:8px">${esc(r.label)}</div>
 ${p.summary?`<div class="mute small" style="margin-top:6px">${esc(p.summary)}</div>`:''}
 <div class=row style="margin-top:10px"><a class=btn2 href="${esc(p.url)}" target=_blank rel=noopener>Instagramへ</a>${qb}</div></div>`}
function vRemind(){const L=P.map(p=>[p,remind(p)]).filter(x=>x[1]).sort((a,b)=>a[1].at.localeCompare(b[1].at)),e=eod();
 if(!L.length)return '<h1>リマインド</h1><div class=hint>DMで返信が来た人が、ここに出ます</div>';
 const a=L.filter(x=>new Date(x[1].at)<=e).map(x=>x[0]),b=L.filter(x=>new Date(x[1].at)>e).map(x=>x[0]);
 return `<h1>リマインド</h1><div class=hint>DMの返信があった人だけが対象です</div>${a.length?`<div class=sec>今日まで(${a.length})</div>${a.map(rcard).join('')}`:''}${b.length?`<div class=sec>これから(${b.length})</div>${b.map(rcard).join('')}`:''}`}
function weekOf(s){const d=new Date(s+'T00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return (d.getMonth()+1)+'/'+d.getDate()+'〜'}
function firstCh(p){const f=p.events.filter(e=>e.kind==='sent'&&ymd(new Date(e.at))===p.firstDate),c=f.some(e=>e.ch==='comment'),d=f.some(e=>e.ch==='dm');return c&&d?'コメント+DM':c?'コメントのみ':d?'DMのみ':'記録なし'}
function grp(O,fn){const m={};O.forEach(p=>{const k=fn(p)||'不明';const v=m[k]||(m[k]={n:0,r:0,a:0,b:0,s:p.firstDate});v.n++;if(replied(p))v.r++;if(adv(p))v.a++;if(p.status==='purchased')v.b++});return Object.entries(m)}
function vData(){const O=P.filter(p=>!p.inbound),n=O.length,r=O.filter(replied).length,a=O.filter(adv).length,rg=O.filter(p=>['rough','purchased'].includes(p.status)).length,b=O.filter(p=>p.status==='purchased').length;
 const pct=(x,y)=>y?Math.round(x/y*100)+'%':'-',c=cost();
 const tbl=(t,rs)=>`<div class=sec>${t}</div><table><tr><th></th><th>人数</th><th>返信率</th><th>検討以上</th><th>購入</th></tr>${rs.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${pct(v.r,v.n)}</td><td>${pct(v.a,v.n)}</td><td>${v.b}</td></tr>`).join('')}</table>`;
 const bySize=x=>x.sort((p,q)=>q[1].n-p[1].n);
 return `<h1>データ</h1><div class=kpi><div><b>${n}</b><span>アプローチ</span></div><div><b>${pct(r,n)}</b><span>返信率(${r})</span></div><div><b>${pct(a,n)}</b><span>検討以上(${a})</span></div><div><b>${rg}</b><span>ラフ依頼以上</span></div><div><b>${b}</b><span>購入</span></div><div><b>${pct(b,n)}</b><span>購入率</span></div></div>
 ${n?tbl('ジャンル別',bySize(grp(O,p=>GENRE[p.genre]||p.genre)))+tbl('国別',bySize(grp(O,p=>p.country)).slice(0,10))+tbl('最初のコメントの型',bySize(grp(O,p=>{const e=p.events.find(e=>e.tpl&&e.tpl[0]==='1');return e?tplLabel(e.tpl):'テンプレ以外'})))+tbl('最初の連絡手段',bySize(grp(O,firstCh)))+tbl('週別',grp(O,p=>weekOf(p.firstDate)).sort((x,y)=>y[1].s.localeCompare(x[1].s)).slice(0,8)):''}
 <div class=sec>データの書き出し</div>
 <button class="btn ghost" id=xCopy>分析用にまとめてコピー(Claudeに貼る用)</button>
 <div class=row style="margin-top:10px"><button class=btn2 id=xP>顧客CSV</button><button class=btn2 id=xE>やりとりCSV</button><button class=btn2 id=xB>バックアップ(画像込み)</button><label class=btn2>バックアップから復元<input type=file id=xR accept=".json,application/json" hidden></label></div>
 <div class=sec>テンプレート(書き換えると保存されます)</div>${TPL.map(t=>`<label class=lb>${esc(t.label)}</label><textarea data-tpl="${t.id}" rows=3>${esc(tplText(t.id))}</textarea>`).join('')}

function csv(R){return R.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}
function peopleRows(){return [['username','url','初回日','相手から','ジャンル','国','フォロワー','車','状態','どんな人','現状','送信数','返信数','最初のコメント','最初のDM','次回予定','次回文面','メモ'],...P.map(p=>{const s=p.events.filter(e=>e.kind==='sent'),r=p.events.filter(e=>e.kind==='reply');return [p.username,p.url,p.firstDate,p.inbound?'1':'',GENRE[p.genre]||p.genre,p.country,p.followers,p.car,ST[p.status][0],p.who,p.summary,s.length,r.length,(s.find(e=>e.ch==='comment')||{}).text,(s.find(e=>e.ch==='dm')||{}).text,p.next?p.next.at:'',p.next?p.next.text:'',p.memo]})]}
function eventRows(){const R=[['username','ジャンル','国','状態','日時','種類','手段','内容']];P.forEach(p=>p.events.forEach(e=>R.push([p.username,GENRE[p.genre]||p.genre,p.country,ST[p.status][0],localDT(new Date(e.at)).replace('T',' '),e.kind==='reply'?'返信':'送信',e.ch==='dm'?'DM':'コメント',e.text])));return R}
async function saveFile(name,text,type){const f=new File([text],name,{type});if(navigator.canShare&&/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
function bindData(){const stamp=today().replace(/-/g,'');
 $('#xCopy').onclick=()=>copy(`【営業記録 ${today()} 時点】\n\n[顧客]\n${csv(peopleRows())}\n\n[やりとり]\n${csv(eventRows())}`);
 $('#xP').onclick=()=>saveFile(`顧客_${stamp}.csv`,'﻿'+csv(peopleRows()),'text/csv');
 $('#xE').onclick=()=>saveFile(`やりとり_${stamp}.csv`,'﻿'+csv(eventRows()),'text/csv');
 $('#xB').onclick=async()=>{toast('バックアップを作成中…');const imgs=await DB.all('images');saveFile(`営業記録バックアップ_${stamp}.json`,JSON.stringify({v:1,at:new Date().toISOString(),people:P,images:imgs}),'application/json')};
 $('#xR').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.people))throw new Error('形式が違います');if(!confirm(`${d.people.length}件の記録で、今のデータを置き換えます。よろしいですか?`))return;await DB.clear('people');await DB.clear('images');for(const x of d.images||[])await DB.put('images',x);for(const p of d.people)await DB.put('people',p);P=await DB.all('people');render();toast('復元しました')}catch(err){toast('復元できません: '+err.message)}};
 document.querySelectorAll('[data-tpl]').forEach(x=>x.onchange=()=>{const c=tplCustom(),t=TPL.find(y=>y.id===x.dataset.tpl);if(x.value.trim()&&x.value!==t.text)c[t.id]=x.value;else delete c[t.id];ls('dc_out_tpl',JSON.stringify(c));toast('テンプレートを保存しました')});
 $('#sGoal').onchange=e=>{S.goal=Math.max(1,parseInt(e.target.value)||10);toast('目標を保存しました')};
 $('#sKey').onchange=e=>{S.key=e.target.value.trim();render();toast(S.key?'APIキーを保存しました':'APIキーを消しました')};
 if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(x=>{const s=$('#stor');if(s)s.textContent=` 使用量 約${(x.usage/1e6).toFixed(1)}MB`}).catch(()=>{})}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-open],[data-copyid],[data-sentid],[data-dt],[data-q],[data-f],#bigBtn,#replyBtn,#back');if(!t)return;
 if(t.id==='back')return closeSheet();
 if(t.id==='bigBtn')return openSheet('新規アプローチ',newFn);
 if(t.id==='replyBtn')return openSheet('返信を追加',replyFn(null));
 if(t.dataset.tab){view=t.dataset.tab;window.scrollTo(0,0);return render()}
 if(t.dataset.open)return openDetail(t.dataset.open);
 if(t.dataset.q){const [id,k,v]=t.dataset.q.split('|'),p=byId(id);return p&&qSet(p,k,v==='1'?true:v)}
 if(t.dataset.dt&&t.dataset.pid){const p=byId(t.dataset.pid);return p&&sendTpl(p,t.dataset.dt)}
 if(t.dataset.copyid){const p=byId(t.dataset.copyid);return p&&p.next&&copy(p.next.text)}
 if(t.dataset.sentid)return markSent(byId(t.dataset.sentid));
 if(t.dataset.f){filter=t.dataset.f;return render()}});
(function(){try{if(!navigator.onLine)return;fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=/const VER='([^']+)'/.exec(t);if(m&&m[1]!==VER&&sessionStorage.getItem('dc_out_upd')!==m[1]){sessionStorage.setItem('dc_out_upd',m[1]);location.replace(location.pathname+'?v='+m[1])}}).catch(()=>{})}catch(e){}})();
(async()=>{try{await DB.open();P=await DB.all('people')}catch(e){toast('保存領域を開けません: '+e.message)}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 render()})();
</script>
</body>
</html>
